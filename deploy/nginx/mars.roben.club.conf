# mars.roben.club — RedSight (NASA Space Apps 2026, Martian Map). Two sites, one domain:
#   /        landing page (landing/dist)            /var/www/mars.roben.club
#   /demo/   the RedSight app (app/dist, base /demo/) /var/www/mars.roben.club/demo
#   /api/*   copilot backend on 127.0.0.1:8788 (systemd user unit)
# Web root is owned by roben and updated by CI (deploy/remote-deploy.sh).
# Installed by deploy/setup-root.sh. ACME webroot on /var/www/html.

server {
    listen 80;
    listen [::]:80;
    server_name mars.roben.club;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mars.roben.club;

    ssl_certificate     /etc/letsencrypt/live/mars.roben.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mars.roben.club/privkey.pem;

    root /var/www/mars.roben.club;
    index index.html;
    # nginx's mime.types has no .geojson (the app also tolerates octet-stream).
    include /etc/nginx/mime.types;
    types { application/geo+json geojson; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Microphone for push-to-talk dictation (STT); nothing else.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Copilot backend: chat (SSE), STT uploads, TTS audio, routing bridge.
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE: stream tokens as they arrive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 13m;
        gzip off;
    }

    # Caching uses `expires` (not add_header) so the server-level security headers
    # above are inherited by every location.

    # ── /demo/ — the app ──
    location /demo/assets/ {
        expires max;   # content-hashed build output
        try_files $uri =404;
    }
    # Map tiles, panoramas, data: revalidate (ETag) so each deploy shows up at once
    location ~ ^/demo/(tiles|pano|hud|preview|markers|data)/ {
        expires epoch;
        try_files $uri =404;
    }
    location = /demo { return 301 /demo/; }
    location /demo/ {
        expires epoch;
        try_files $uri $uri/ /demo/index.html;
    }

    # ── / — landing page ──
    location /assets/   { expires max; try_files $uri =404; }
    location /fonts/    { expires max; try_files $uri =404; }
    location /textures/ { expires max; try_files $uri =404; }
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/geo+json application/wasm;

    access_log /var/log/nginx/mars.roben.club.access.log;
    error_log  /var/log/nginx/mars.roben.club.error.log;
}
